# Documented OSV-scanner exemptions. The scan fails on any finding that is
# NOT listed here - every entry is a version-scoped, reason-backed decision
# that was reviewed in the PR that added it, and stops applying as soon as
# the package version moves (so a real fix or a new vulnerability surfaces
# again). Removing an entry, or pinning an unlisted vulnerable version, goes
# red. Policy: CONVENTIONS.md, "Dependency exceptions".
# Regenerate checks: scripts/deps.sh   (local parity with the CI audit)
[[PackageOverrides]]
ecosystem = "crates.io"
name = "glib"
version = "0.18.5"
ignore = true
reason = "RUSTSEC-2024-0429 (medium 6.9). glib 0.18.x enters through Tauri 2's GTK stack (tao/muda); the fix lives in the Tauri 3 / gtk-rs 0.20 migration, tracked in ROADMAP.md. Linux-only surface."

[[PackageOverrides]]
ecosystem = "crates.io"
name = "proc-macro-error"
version = "1.0.4"
ignore = true
reason = "RUSTSEC-2024-0370: unmaintained crate, no fixed release exists. Build-time proc-macro helper only; surfaced again the moment any dependency stops pulling it."

[[PackageOverrides]]
ecosystem = "crates.io"
name = "unsafe-libyaml"
version = "0.2.11"
ignore = true
reason = "RUSTSEC-2024-0449: unmaintained crate, no fixed release exists. Enters through the serde_yaml chain in build/test config parsing."
