name: Guard main (trunk integrity)

# Same contract as guard-dev.yml, mirrored for the release trunk: main must
# only ever advance by merge commits (release PRs dev -> main). Payload-only
# job: no checkout, no build - free-plan-cheap.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  trunk-integrity-main:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect push metadata (not the code)
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail

          head_commit=$(printf '%s' "$EVENT_JSON" | jq -r '.head_commit // null')
          if [ "$head_commit" = "null" ]; then
            echo "::error::TRUNK GUARD (main): push carries no head_commit - a branch deletion or a non-commit push. Branches are never deleted from trunks."
            exit 1
          fi

          forced=$(printf '%s' "$EVENT_JSON" | jq -r '.forced // false')
          if [ "$forced" = "true" ]; then
            echo "::error::TRUNK GUARD (main): '.forced' is true - a history rewrite reached the trunk. Shared history is immutable."
            exit 1
          fi

          parent_count=$(printf '%s' "$EVENT_JSON" | jq '.head_commit.parents | length')
          if [ "$parent_count" -lt 2 ]; then
            echo "::error::TRUNK GUARD (main): head commit has $parent_count parent(s) - a squash merge, fast-forward or direct push reached main. Trunk tips must be merge commits (CONVENTIONS.md)."
            exit 1
          fi

          echo "main head $(printf '%s' "$head_commit" | jq -r '.id') is a merge commit ($parent_count parents), not forced - OK."
